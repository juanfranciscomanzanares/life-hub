<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#d946ef" />
    </linearGradient>
  </defs>

  <!-- Fondo a sangre: obligatorio para que el icono maskable no salga recortado -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!--
    Marca: un núcleo con tres satélites sobre su órbita (las áreas de la vida
    girando alrededor del panel).

    Todo queda dentro de un radio de 188 desde el centro, por debajo de los 205
    que Android reserva como zona segura al recortar el icono en círculo.
  -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.38" />
  <g fill="#ffffff">
    <circle cx="256" cy="256" r="62" />
    <circle cx="256" cy="108" r="44" />
    <circle cx="384" cy="330" r="36" />
    <circle cx="128" cy="330" r="36" />
  </g>
</svg>
