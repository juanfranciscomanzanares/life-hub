<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#d946ef" />
    </linearGradient>
  </defs>
  <!-- Fondo a sangre completa (ideal para icono maskable y apple-touch) -->
  <rect width="512" height="512" fill="url(#bg)" />
  <!-- Barras tipo dashboard -->
  <g opacity="0.28" fill="#ffffff">
    <rect x="330" y="300" width="34" height="120" rx="10" />
    <rect x="378" y="250" width="34" height="170" rx="10" />
    <rect x="426" y="200" width="34" height="220" rx="10" />
  </g>
  <!-- Inicial -->
  <text x="200" y="270" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="bold"
    fill="#ffffff" text-anchor="middle" dominant-baseline="central">Q</text>
</svg>
